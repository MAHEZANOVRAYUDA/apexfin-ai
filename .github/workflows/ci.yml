name: ApexFin AI Quality Gate & CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Verify Code Formatting (Ruff Format)
        run: ruff format --check .

      - name: Enforce Code Quality & Style Rules (Ruff Check)
        run: ruff check .

  test-suite:
    name: Automated Testing Trophy (Unit, Integration, RAG Benchmark)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Application and Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,eval]"

      - name: Run Test Suite (Unit + Integration + Evaluation)
        env:
          ENVIRONMENT: testing
        run: |
          pytest --verbose --capture=no --durations=10 tests/

