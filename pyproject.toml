[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexfin-ai"
version = "0.1.0"
description = "Production-Grade Financial Intelligence & Audit-Ready Hybrid RAG Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Maheza Novrayuda", email = "maheza@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "pdfplumber>=0.11.4",
    "pymupdf>=1.24.11",
    "fastembed>=0.4.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.12.0",
    "groq>=0.11.0",
    "google-genai>=0.1.1",
    "instructor>=1.6.0",
    "jinja2>=3.1.4",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "T201"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
